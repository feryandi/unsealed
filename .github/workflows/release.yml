name: Build & Release

# Build standalone executables for Windows, Linux and macOS and attach them to
# a GitHub Release. Triggers:
#   * pushing a version tag like `v0.4.1` -> builds + publishes a Release
#   * manual "Run workflow" -> builds + uploads artifacts only (no Release)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the Release

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            ext: ".exe"
          - os: ubuntu-latest
            suffix: linux-x64
            ext: ""
          - os: macos-latest
            suffix: macos-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pygame / PyOpenGL need a few system libs present so PyInstaller can
      # import and introspect them during analysis on Linux runners.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsdl2-2.0-0

      - name: Install project (viewer + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[viewer,build]"

      - name: Build unsealed-reader
        run: pyinstaller --noconfirm --clean src/unsealed/reader/unsealed-reader.spec

      - name: Build unsealed-viewer
        run: pyinstaller --noconfirm --clean src/unsealed/viewer/unsealed-viewer.spec

      # PyInstaller writes dist/unsealed-reader[.exe] etc. Rename with an OS
      # suffix so Release assets from different runners don't collide.
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p out
          cp "dist/unsealed-reader${{ matrix.ext }}" "out/unsealed-reader-${{ matrix.suffix }}${{ matrix.ext }}"
          cp "dist/unsealed-viewer${{ matrix.ext }}" "out/unsealed-viewer-${{ matrix.suffix }}${{ matrix.ext }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsealed-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
