name: Build & Release

# Build the standalone Windows executables and attach them to a GitHub Release.
# Windows-only: the tooling targets the Windows game client (e.g. the .spak key
# recovery dumps the running client's memory), so Linux/macOS builds can't work.
# Triggers:
#   * pushing a version tag like `v0.4.1` -> builds + publishes a Release
#   * manual "Run workflow" -> builds + uploads artifacts only (no Release)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed to create/update the Release

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (gui + viewer + build extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,viewer,build]"

      # The reader ships as a single GUI bundle built from the full
      # __main__.py entry, so the one exe launches the GUI by default and also
      # runs the decode/recover-key subcommands (no separate headless build).
      - name: Build unsealed-reader-gui
        run: pyinstaller --noconfirm --clean src/unsealed/reader/unsealed-reader-gui.spec

      - name: Build unsealed-viewer
        run: pyinstaller --noconfirm --clean src/unsealed/viewer/unsealed-viewer.spec

      # PyInstaller writes the viewer onefile exe as dist/unsealed-viewer[.exe].
      # Rename with an OS suffix so Release assets stay unambiguous.
      - name: Stage onefile artifacts
        shell: bash
        run: |
          mkdir -p out
          cp "dist/unsealed-viewer${{ matrix.ext }}" "out/unsealed-viewer-${{ matrix.suffix }}${{ matrix.ext }}"

      # The GUI is a onedir bundle (Qt shipped as external DLLs for LGPL), so
      # zip the whole dist/unsealed-reader-gui folder into one release asset.
      - name: Stage GUI bundle (zip)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/unsealed-reader-gui -DestinationPath "out/unsealed-reader-gui-${{ matrix.suffix }}.zip" -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsealed-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
