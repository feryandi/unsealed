indent-width = 2

[lint]
select = ["E", "F", "W505"]

[format]
indent-style = "space"
line-ending = "auto"

[lint.pycodestyle]
max-line-length = 88
# Docs/comments wrap at the same column as code. The narrower PEP 8
# prose width (72) was never what this codebase was written to.
max-doc-length = 88
